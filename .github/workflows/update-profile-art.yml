name: Update Profile Art & Stats

on:
  schedule:
    - cron: '0 0 * * *'  # Runs automatically every day at 00:00 UTC
  workflow_dispatch:     # Allows manual trigger button from GitHub Actions UI
  push:
    branches:
      - main

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow

      - name: Fetch Latest GitHub Contributions
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: 'NINJA-1029'

      - name: Generate Terminal & Info Cards
        run: |
          python scripts/make_info_card.py
          python scripts/make_terminal_card.py

      - name: Commit & Push Auto-Updated SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update contribution stats & profile SVGs [skip ci]"
          file_pattern: 'data/contributions.json *.svg'
